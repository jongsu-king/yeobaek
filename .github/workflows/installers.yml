name: Installer smoke tests

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release to install
        required: true
        default: v0.3.1
      platform:
        description: Installer platform
        type: choice
        options: [all, windows, linux]
        default: all
  release:
    types: [published]

permissions:
  contents: read

jobs:
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'linux'
    name: Windows x64 install and uninstall
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || 'v0.3.1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install release, launch and preserve external notes
        shell: pwsh
        run: ./packaging/smoke_windows.ps1

  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    name: Linux AMD64 install and uninstall
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || 'v0.3.1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install release, save in the GUI and preserve external notes
        run: bash packaging/smoke_linux.sh
